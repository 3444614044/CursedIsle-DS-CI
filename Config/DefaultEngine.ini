; DefaultEngine.ini — Dedicated Server 侧（抓包修正版）
;
; 修正：pak 内客户端 ini 的 WebSocketPort=8889 是实验插件默认值；
; 真实 /api/v1/servers/all_servers 下发端口为 7777–7863（UE4 默认 NetDriver 段）。
; 本 DS 监听 7777，与 config.json → local_ds.port 保持一致。
; 合并进游戏工程 Config/DefaultEngine.ini，不要整文件覆盖。

[/Script/Engine.GameEngine]
; 方案 A（默认）：使用引擎标准 IpNetDriver，UDP 7777
; 若用 ws_probe.py 抓到客户端首包确实要求 WebSocket 封装，再切回方案 B（见 README）
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver", DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver", DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=30
LanServerMaxTickRate=35
MaxClientRate=15000
MaxInternetClientRate=10000
ConnectionTimeout=60.0
InitialConnectTimeout=120.0
RelevantTimeout=5.0
SpawnPrioritySeconds=1.0
ServerTravelPause=4.0
AllowPeerConnections=False
AllowPeerVoice=False
MaxPortCountToTry=512

; 端口由启动参数 -Port=7777 指定；此处仅作默认兜底
[/Script/Engine.NetDriver]
NetConnectionClassName="/Script/OnlineSubsystemUtils.IpConnection"

[SystemSettings]
net.MaxNetStringSize=1024

[/Script/Engine.Server]
bDisableTickSmoothing=True

; ---------------------------------------------------------------
; 方案 B（备用，仅当抓包确认客户端走 WebSocket 时启用）：
; [/Script/Engine.GameEngine]
; !NetDriverDefinitions=ClearArray
; +NetDriverDefinitions=(DefName="GameNetDriver", DriverClassName="/Script/WebSocketNetworking.WebSocketNetDriver", DriverClassNameFallback="/Script/WebSocketNetworking.WebSocketNetDriver")
; [/Script/WebSocketNetworking.WebSocketNetDriver]
; WebSocketPort=7777
; NetConnectionClassName="/Script/WebSocketNetworking.WebSocketConnection"
; AllowPeerConnections=False

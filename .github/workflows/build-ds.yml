name: Build CursedIsle DS (LinuxAArch64, UE4.27)

# 修复记录：
#  - 镜像 wukakuki/unreal-engine:dev-slim-4.27.2 是 linux/amd64 架构，
#    在 arm64 runner 上会因 exec format error 秒退（container is not running）。
#    改回 x86_64 runner 原生运行镜像，再交叉编译出 ARM64 二进制。
#  - UE4.27 的 UBT 平台名是 LinuxAArch64（UE5 才叫 LinuxArm64）。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "4.27 的 ARM64 平台名（报错 Unknown platform 就切另一个）"
        required: true
        default: LinuxAArch64
        type: choice
        options: [LinuxAArch64, LinuxArm64]
      config:
        description: "构建配置"
        required: true
        default: Development
        type: choice
        options: [Development, Shipping]
      image:
        description: "构建镜像 tag（amd64 镜像，内含 ARM64 交叉工具链）"
        required: true
        default: wukakuki/unreal-engine:dev-slim-4.27.2

env:
  PROJ: ${{ github.workspace }}/standalone/CursedIsleLocalServer.uproject
  PLATFORM: ${{ github.event.inputs.platform || 'LinuxAArch64' }}
  CONFIG: ${{ github.event.inputs.config || 'Development' }}
  UAT: /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh

jobs:
  ds:
    # ★ 必须是 x86_64：镜像是 amd64，arm64 runner 跑不起来
    runs-on: ubuntu-24.04
    container:
      image: ${{ github.event.inputs.image || 'wukakuki/unreal-engine:dev-slim-4.27.2' }}
      options: --user root --platform linux/amd64
    timeout-minutes: 360
    steps:
      - name: 环境自检
        shell: bash
        run: |
          set -e
          echo "host arch : $(uname -m)"          # 应为 x86_64
          echo "UAT       : $UAT"
          test -f "$UAT" || { echo "✘ 镜像里没有 RunUAT.sh，tag 不对"; exit 1; }
          echo "--- UBT 平台目录（确认叫 LinuxAArch64 还是 LinuxArm64）---"
          ls /home/ue4/UnrealEngine/Engine/Source/Programs/UnrealBuildTool/Platforms/ 2>/dev/null \
            | grep -i 'linux\|arm' || echo "(Installed Build 无源码目录，忽略)"
          echo "--- ARM64 交叉工具链线索 ---"
          ls /home/ue4/UnrealEngine/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64/ 2>/dev/null | head || true
          echo "LINUX_MULTIARCH_ROOT=${LINUX_MULTIARCH_ROOT:-<unset>}"
          df -h

      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: 修权限（容器内以 ue4 用户构建）
        run: chown -R ue4:ue4 "$GITHUB_WORKSPACE"

      - name: 交叉编译 ARM64 Server
        shell: bash
        run: |
          set -e
          BUILD() { runuser -u ue4 -- env HOME=/home/ue4 "$UAT" "$@"; }
          echo "== BuildTarget / $PLATFORM / $CONFIG =="
          if ! BUILD BuildTarget \
                 -project="$PROJ" \
                 -Target=CursedIsleLocalServerServer \
                 -TargetPlatform="$PLATFORM" \
                 -BuildConfiguration="$CONFIG" \
                 -NoP4 -WaitMutex -utf8output -unattended; then
            echo "!! BuildTarget 失败，回退 BuildCookRun(-server -noclient -skipcook)"
            BUILD BuildCookRun \
                 -project="$PROJ" -platform="$PLATFORM" \
                 -server -noclient -serverconfig="$CONFIG" \
                 -noP4 -nodebuginfo -skipcook -skipstage -skippak -skiparchive \
                 -build -utf8output -unattended
          fi

      - name: 抽取并校验 ARM64 二进制
        shell: bash
        run: |
          set -e
          mkdir -p /out
          echo "--- Binaries 全貌 ---"
          find "$GITHUB_WORKSPACE/standalone/Binaries" -maxdepth 3 2>/dev/null || true
          BIN=$(find "$GITHUB_WORKSPACE/standalone/Binaries" -type f \
                -name 'CursedIsleLocalServerServer*' -perm -u+x 2>/dev/null | head -n 1)
          [ -n "$BIN" ] || { echo "✘ 没找到 Server 二进制"; exit 1; }
          cp "$BIN" /out/CursedIsleLocalServerServer
          chmod +x /out/CursedIsleLocalServerServer
          ls -lh /out/CursedIsleLocalServerServer
          file /out/CursedIsleLocalServerServer
          # 防止误拿到 x86_64 的二进制（交叉编译没生效时会这样）
          file /out/CursedIsleLocalServerServer | grep -Eqi 'ARM|aarch64' || {
            echo "✘ 产物不是 ARM64 ELF，检查 -TargetPlatform 是否被忽略"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: CursedIsleDS-4.27-${{ github.event.inputs.platform || 'LinuxAArch64' }}-${{ github.event.inputs.config || 'Development' }}
          path: /out/CursedIsleLocalServerServer
          retention-days: 30

      - name: 失败抓日志
        if: failure()
        shell: bash
        run: |
          for d in "/home/ue4/Library/Logs/Unreal Engine/LocalBuildLogs" \
                   "/github/home/Library/Logs/Unreal Engine/LocalBuildLogs" \
                   "$GITHUB_WORKSPACE/standalone/Saved/Logs"; do
            [ -d "$d" ] || continue
            find "$d" -type f \( -name '*.log' -o -name '*.txt' \) 2>/dev/null \
              | head -5 | while read -r f; do echo "===== $f ====="; tail -n 120 "$f"; done
          done

; =====================================================================
; CursedIsleLocalServer — DefaultGame.ini (UE4.27)
;
; ★ ProjectVersion 故意对齐客户端 0.9.9.0.849。
;   FNetworkVersion 的校验和包含「项目名 + 项目版本 + NetCL +
;   EngineNetworkProtocolVersion + GameNetworkProtocolVersion」，
;   本工程名与客户端工程名不同，所以校验和仍然不会相等 ——
;   必须用 -networkversionoverride=<客户端值> 覆盖，见 run_ds.sh / 排错手册。
; =====================================================================

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=LOCAL_HANDSHAKE_VERIFY_ONLY
ProjectName=CursedIsleLocalServer
ProjectVersion=0.9.9.0.849
CompanyName=LocalDev
bUseFixedFrameRate=False

[/Script/Engine.GameSession]
MaxPlayers=8
bRequiresPushToTalk=False

[/Script/Engine.GameMode]
; 握手验证阶段用引擎自带空地图；客户端 pak 里没有这个地图，
; 所以 NMT_Welcome 之后客户端会在 LoadMap 阶段停下 —— 属预期行为。
; 若要对齐客户端 pak 中的地图名，把下面两项改成 /Game/Maps/ServerManager
; （DS 侧仍需自行提供可加载的地图资产，见 ue4_ds/README.md）。
GameDefaultMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/CursedIsleLocalServer.LocalServerGameMode

[/Script/UnrealEd.ProjectPackagingSettings]
Build=AlwaysCook
